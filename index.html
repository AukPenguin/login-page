<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>


    <body>
        
        <div class="page-container">
            <div class="login-container">
            
                <div class="form-title">
                    <div class="title">Log in</div>
                    <div class="title-bar"></div>
                </div>
                
                <form class="login-form">
                    
                    <div>
                        <label for="user-name">User name</label>
                        <input id="user-name clear" type="text" required>
                    </div>

                    <div>
                        <label for="email"></label>
                        <input id="email clear" type="email" placeholder="email" required>
                    </div>

                    <div>
                        <label for="password"></label>
                        <input id="password clear" type="password" placeholder="password" minlength="5" pattern="^[a-zA-Z0-9_]*$" required>
                    </div>
                    <button class="submit-button" type="reset">Submit</button>
                </form>
            
            </div>
        </div>


    </body>
</html>
